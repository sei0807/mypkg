name: test
on: push
jobs:
  test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v2
      - name: build and test
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-pytest ros-humble-launch-testing-ros ros-humble-ament-copyright ros-humble-ament-flake8 ros-humble-ament-pep257
          source /opt/ros/humble/setup.bash
          colcon build
          source install/setup.bash
          colcon test --event-handlers console_direct+
